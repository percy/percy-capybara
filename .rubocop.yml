inherit_gem:
  percy-style:
    - default.yml
RSpec/InstanceVariable:
  Exclude:
    -
RSpec/ContextWording:
  Enabled: false
RSpec/MultipleDescribes:
  Enabled: false
Style/BracesAroundHashParameters:
  Enabled: false
AllCops:
  TargetRubyVersion: 2.4
  Include:
    - lib/**/*.rb
    - spec/lib/**/*.rb

Metrics/LineLength:
  Exclude:
    - spec/**/*
